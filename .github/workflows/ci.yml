# PR 檢查。做的事就是 `scripts/tpass check`（lint + tsc）再加上 build 與測試，
# 只是換一個地方跑：換成一台什麼都沒有的全新機器，而且在 merge 進 main 之前跑。
#
# 為什麼要有這個：main 沒有任何守門員，而現在有四個人有寫入權、還有一顆一鍵部署按鈕。
# 這條 workflow 的唯一工作，是讓「壞掉的 code 進得了 main」這件事不再是預設值。
name: ci

on:
  # 主要觸發時機。PR 一開、每次再推 commit 都跑一次——這才是「merge 前擋下來」。
  pull_request:
  # 保險絲。分支保護留了管理員繞道的逃生門（見 docs），有人直推 main 時
  # 至少 main 自己的歷史上留得下一顆紅燈，不會沒人知道。
  push:
    branches: [main]

# 同一個 PR 連推三次，前兩次的執行直接取消，只留最新那次。
# 省 runner 時間，也避免「舊 commit 的綠燈」看起來像是在幫新 commit 背書。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小權限。這個 job 只需要讀自己的原始碼，不需要寫 repo、不需要碰 packages。
# 預設是讀寫，明寫成唯讀 = 就算 workflow 被改壞也偷不走東西。
permissions:
  contents: read

jobs:
  # ⚠️ 這個 job 的名字（check）就是第 2 段分支保護要勾的那個名字。
  # 每個 repo 都叫 check，設定分支保護時才不用每個 repo 記一個不同的字。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # build 期間會 import src/config/*.ts，那裡的 REQUIRED 檢查缺 env 就直接 throw。
    # 所以 CI 需要一份「形狀正確但完全是假的」env。
    #
    # 🔒 這裡永遠不放真值。這個 repo 是 public，workflow 檔任何人都看得到；
    # 而且 CI 不連任何真實資料庫、不打真的 auth——它只是編譯。
    # 網域一律用 .invalid（RFC 2606 保證這個 TLD 永遠解析不出來）：
    # 萬一哪天有人寫出「build 時就去 fetch」的 code，它會當場爆炸，而不是安靜地打到正式站。
    env:
      AUTH_JWKS_URL: https://ci.invalid/.well-known/jwks.json
      AUTH_AUTHORIZE_URL: https://ci.invalid/api/auth/authorize
      AUTH_LOGOUT_URL: https://ci.invalid/api/auth/logout
      APPEALS_SELF_URL: https://ci.invalid
      PORTAL_URL: https://ci.invalid
      TPASS_SERVICE_ID: appeals
      JWT_ISSUER: https://ci.invalid
      # Prisma 7 的 prisma.config.ts 在載入時就解析 env("DATABASE_URL")，缺了連 prisma generate
      # （postinstall 會跑）都起不來。CI 不會真的連線，給個形狀正確的假值就好。
      DATABASE_URL: postgresql://ci:ci@ci.invalid:5432/ci

    steps:
      # action 版本明寫死。GitHub 的 runner 會把 node20 時代的 action 強制跑在 node24 上並警告，
      # 一路釘在最新的大版本就不會累積這種待爆的技術債。
      - uses: actions/checkout@v7

      # 順序有意義：pnpm 要先裝好，下一步的 cache: pnpm 才找得到它來算快取路徑。
      # 版本不寫在這裡——action 會讀 package.json 的 packageManager 欄位（pnpm@10.27.0）,
      # 跟本機、主機是同一個真相來源。
      - uses: pnpm/action-setup@v6

      # 22 是刻意的：主機跑的就是 node v22。CI 綠了但主機炸掉是最沒有價值的綠燈。
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # --frozen-lockfile：鎖檔跟 package.json 對不上就直接失敗，不會自作主張改鎖檔。
      # 這正是 CI 想要的行為——它要重現的是「這個 commit 當時的依賴」，
      # 不是「今天裝起來會變成什麼」。deploy.sh 上線時用的也是同一個旗標。
      - run: pnpm install --frozen-lockfile

      # Prisma client 是生成物，不進 git，也沒有 postinstall 會帶到（deploy.sh:175 有同樣的註解）。
      # 少這一步，下面的 tsc 會拿不到 model 型別。
      - run: pnpm exec prisma generate

      # Next 16 把 route 的型別（RouteContext…）生成在 .next/types/ 底下。
      # 全新 clone 沒有 .next，所以 tsc 會噴 Cannot find name 'RouteContext'——
      # 本機不會發生，因為你的 .next 一直都在。typegen 只生型別，不做完整 build。
      - run: pnpm exec next typegen

      # 由快到慢排：lint 幾秒、tsc 十幾秒、測試很快、build 最久。
      # 錯誤越早出現，等紅燈的時間越短。
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm run build
